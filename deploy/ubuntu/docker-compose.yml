services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - h5p-engine
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      args:
        # Browser requests remain on the same public origin and are routed by
        # nginx to the API service, so no browser-to-API CORS is required.
        NEXT_PUBLIC_API_URL: /backend
        H5P_ENGINE_INTERNAL_URL: http://h5p-engine:3001
    environment:
      API_INTERNAL_URL: http://api:8080
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY}
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ../../apps/api
    environment:
      ConnectionStrings__Default: Data Source=/app/data/h5p-lms.db
      H5p__InternalUrl: http://h5p-engine:3001
      H5p__PublicUrl: ${PUBLIC_ORIGIN}/h5p-engine
      H5p__WebhookSecret: ${H5P_WEBHOOK_SECRET}
      H5p__InternalApiKey: ${H5P_INTERNAL_API_KEY}
      H5p__SupportedLanguages__0: vi
      H5p__SupportedLanguages__1: en
      Integration__ApiKey: ${INTEGRATION_API_KEY}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN}
    volumes:
      - api-data:/app/data
    depends_on:
      h5p-engine:
        condition: service_healthy
    restart: unless-stopped

  h5p-engine:
    build:
      context: ../../services/h5p-engine
    environment:
      PORT: 3001
      H5P_BASE_URL: ${PUBLIC_ORIGIN}/h5p-engine
      H5P_DATA_PATH: /data/h5p
      H5P_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      H5P_PARENT_ORIGIN: ${PUBLIC_ORIGIN}
      H5P_WEBHOOK_URL: http://api:8080/api/h5p/xapi
      H5P_WEBHOOK_SECRET: ${H5P_WEBHOOK_SECRET}
      H5P_INTERNAL_API_KEY: ${H5P_INTERNAL_API_KEY}
      H5P_SUPPORTED_LANGUAGES: vi,en
      H5P_MAX_UPLOAD_MB: 100
    volumes:
      - h5p-data:/data/h5p
    restart: unless-stopped

volumes:
  api-data:
  h5p-data:
